[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devopspipeline"
version = "1.0.0"
description = "Extensible Python CI/CD platform with pluggable runners, stages and integrations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DevOpsPipeline Maintainers", email = "ci@example.com" }]
requires-python = ">=3.10"
keywords = ["ci", "cd", "pipeline", "devops", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "click>=8.1",
    "rich>=13.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "croniter>=2.0",
    "prometheus-client>=0.20",
    "cryptography>=42.0",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
containers = ["docker>=7.0"]
kubernetes = ["kubernetes>=29.0"]
queue = ["redis>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "types-PyYAML",
    "types-croniter",
]

[project.scripts]
devops = "cli.main:main"

[project.urls]
Homepage = "https://github.com/example/devopspipeline"
Documentation = "https://github.com/example/devopspipeline/tree/main/docs"
Issues = "https://github.com/example/devopspipeline/issues"

[tool.setuptools.packages.find]
include = ["src*", "cli*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
